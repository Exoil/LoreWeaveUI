sonar.projectKey=Exoil_LoreWeaveUI
sonar.organization=exoil
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src/__tests__
sonar.sourceEncoding=UTF-8

# NSwag-generated client is not hand-written code, so it is excluded from
# analysis and from coverage requirements.
sonar.exclusions=src/services/httpClients/**,src/**/*.d.ts
sonar.coverage.exclusions=src/main.ts,src/services/httpClients/**,src/__tests__/**

# Produced by `bun run coverage` (see test.coverage in vite.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
