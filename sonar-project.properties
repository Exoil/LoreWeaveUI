sonar.projectKey=Exoil_LoreWeaveUI
sonar.organization=exoil
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src/__tests__
sonar.sourceEncoding=UTF-8

# `sonar.sources=src` would otherwise swallow `sonar.tests`, and Sonar requires
# the two sets to be disjoint ("can't be indexed twice"). `sonar.exclusions`
# applies to sources only, so listing the test dir here separates them.
#
# The NSwag-generated client is not hand-written code, so it is excluded from
# analysis and from coverage requirements.
sonar.exclusions=src/__tests__/**,src/services/httpClients/**,src/**/*.d.ts
sonar.coverage.exclusions=src/main.ts,src/services/httpClients/**

# Produced by `bun run coverage` (see test.coverage in vite.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
